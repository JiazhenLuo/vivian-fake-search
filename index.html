    <section id="resultsView" hidden aria-label="Search results">

<button class="mini-wordmark" type="button" data-home aria-label="Google home">
  <img src="images/google-logo.svg" alt="Google">
</button>        <form id="headerForm" class="header-form" role="search">

        <p class="result-count">About 7,420 results (0.38 seconds)</p>

        <article class="result">
          <button type="button" data-article="symbolism">
            <span class="site-line"><span class="site-mark">A</span><span>Avian Lore Archive<span class="site-url">avianlore.example › field-notes › feathers</span></span></span>
            <h2 class="result-title">Finding a Dead Bird Feather: Folklore &amp; Symbolism</h2>
            <p class="result-copy">Across many traditions, a fallen feather can symbolize endings, warnings, or transition. Context—and the manner in which it was found—matters.</p>
          </button>
        </article>

        <article class="result">
          <button type="button" data-article="protection">
            <span class="site-line"><span class="site-mark">H</span><span>Hearth &amp; Hollow<span class="site-url">hearthandhollow.example › rituals › protection</span></span></span>

            <p class="result-copy">A quiet guide to cleansing, warding, and returning found objects to the earth. Includes notes on candles, thread, and personal tokens.</p>
          </button>
        </article>

        <article class="result">
          <button type="button" data-article="revenge">

        </article>

        <article class="result">
          <button type="button" data-article="success">
            <span class="site-line"><span class="site-mark">N</span><span>Nocturne Almanac<span class="site-url">nocturnealmanac.example › exchanges › ambition</span></span></span>
            <h2 class="result-title">Spell for Success at the Cost of Someone Else’s Success</h2>
            <p class="result-copy">An old exchange ritual said to turn another person’s momentum toward the petitioner. The working calls for a feather, wax, and two written names.</p>
          </button>
        </article>

        <article class="result">
          <button type="button" data-article="downfall">
            <span class="site-line"><span class="site-mark">B</span><span>Book of Unquiet Things<span class="site-url">unquietthings.example › rites › undoing</span></span></span>
            <h2 class="result-title">Spell for Someone’s Downfall</h2>

        </article>

        <section class="related" aria-label="Related searches">

        <button id="backButton" class="back-button" type="button" aria-label="Back to search results">←</button>

      <div class="article-page">
